    ## Matrix & Pinout Reference { #matrix-pins }

    === "Rev 4 (RP2040 Pro Micro)"

        ![m66 rev4 matrix](pics/m66/mlego-m66-rev4-matrix-LAYOUT_ortho_5x14.svg){ loading=lazy }

    === "Rev 3 (XIAO RP2040)"

        ![m66 rev3 matrix](pics/m66/mlego-m66-rev3-matrix-LAYOUT_ortho_5x14.svg){ loading=lazy }

    === "Rev 2 (XIAO RP2040)"

        ![m66 rev2 matrix](pics/m66/mlego-m66-rev2-matrix-LAYOUT_ortho_5x14.svg){ loading=lazy }

    === "Rev 1 (XIAO RP2040)"

        ![m66 rev1 matrix](pics/m66/mlego-m66-rev1-matrix-LAYOUT_ortho_5x14.svg){ loading=lazy }

        ```text
        ShiftRegister SN74HC595N (#1 & #2)        ShiftRegister 74HC165N (#3)
        QB |1    16| VCC                          nPL |1    16| VCC
        QC |2    15| QA                            CP |2    15| nCE
        QD |3    14| SER data                      D4 |3    14| D3
        QE |4    13| OE                            D5 |4    13| D2
        QF |5    12| RCLK latch                    D6 |5    12| D1
        QG |6    11| SRCLK clock                   D7 |6    11| D0
        QH |7    10| SRCLR                        nQ7 |7    10| DS
         G |8     9| QH*                            G |8     9| Q7
        ```

        | Rows | C0 | C1 | C2 | C3 | C4 | C5 | C6 | C7 | C8 | C9 | C10 | C11 | C12 | C13 | Row Pin |
        | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |
        | **R0** | Esc | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | 9 | 0 | - | Bksp | MUTE | `3D0` |
        | **R1** | Tab | q | w | e | r | t | y | u | i | o | p | [ | ] | X* | `3D1` |
        | **R2** | # | a | s | d | f | g | h | j | k | l | ; | ' | Enter | X* | `3D2` |
        | **R3** | Shift | \ | z | x | c | v | b | n | m | , | . | Up | / | X* | `3D3` |
        | **R4** | Ctrl | Menu | Lower | Alt | Raise | Space | Space | Space | AltGr | Shift | Left | Down | Right | X* | `3D4` |
        | **Col Pin** | `2QB` | `2QC` | `2QD` | `2QE` | `2QF` | `2QG` | `2QH` | `2QA` | `1QH` | `1QG` | `1QF` | `1QE` | `1QA` | `1QD` | *(X* NC)* |

        * **Encoders**: `Pad_A = GP27`, `Pad_B = GP26`
        * **OLED (I²C)**: `SCL = GP7`, `SDA = GP6`
        * **`74HC595N` (Columns)**: `MOSI = GP3` (pin 11), `Latch = GP1` (pin 8), `Clock = GP2` (pin 9)
        * **`74HC165N` (Rows)**: `Latch = GP1` (pin 8), `Clock = GP2` (pin 9), `MISO = GP4` (pin 10)
        * **LEDs (RP2040)**: `CAPS_LOCK = GP25`, `Lower = GP16`, `Raise = GP17`, `RGB DI = GP12`, `RGB On = GP11`
- id: m65
  title: m65 (5×13 Ortho)
  category: keyboards
  badge: 5×13 Ortho
  keys: '65'
  mcu: STM32F401 / RP2040 / XIAO
  firmware: QMK & ZMK
  image: pics/mlego_m65_rev11_eink.webp
  summary: Original 65-key ISO-friendly LEGO ortholinear keyboard evolved across 11
    revisions — from BluePill to Raspberry Pi Pico and Seeed XIAO SPI shift registers.
  content: |
    # m65 — 5×13 LEGO Ortholinear Keyboard

    <div class="spec-badges">
      <span class="spec-badge spec-badge--status">Status: Rev 11 Tested</span>
      <span class="spec-badge">5×13 Ortho (65–66 Keys)</span>
      <span class="spec-badge">XIAO RP2040 / BLE · Pico · STM32</span>
      <span class="spec-badge">SPI Shift Registers (74HC595 / 589 / 165)</span>
      <span class="spec-badge">OLED &amp; E-Ink + Rotary Encoder</span>
      <span class="spec-badge">QMK &amp; ZMK</span>
    </div>

    <div class="image-grid" markdown>
    ![m65 rev 11 with WeAct e-ink display](pics/mlego_m65_rev11_eink.webp){ loading=lazy }
    ![m65 rev 11 with OLED display](pics/mlego_m65_rev11_oled.webp){ loading=lazy }
    </div>

    The **m65** is a 5-row, 13-column ortholinear mechanical keyboard designed to accommodate all standard keycaps from an ISO layout.

    In its later iterations (**Rev 7–Rev 11**), it departs from a traditional direct-pin matrix and uses the tiny [Seeed Studio XIAO RP2040](https://wiki.seeedstudio.com/XIAO-RP2040/) or [Seeed Studio XIAO nRF52840 BLE](https://wiki.seeedstudio.com/XIAO_BLE/) (`SAMD21` may also work). Because the XIAO only exposes 11 GPIO pins, rows are scanned via a `74HC589` (or `74HC165`) input shift register while columns are driven by two chained `74HC595` output shift registers over hardware SPI (sharing clock and latch pins), leaving pins free for an I²C OLED / SPI e-ink screen and a clickable rotary encoder (making Rev 9–11 technically a 14-column matrix, later spun off into the [**m66**](#doc/m66) line).

    > **Seeed Studio Sponsorship**
    >
        For **Rev 7**, Seeed Studio kindly sponsored the 5×13 version with PCBs and XIAO microcontrollers as part of the [Seeed Fusion DIY XIAO Mechanical Keyboard Contest](https://www.seeedstudio.com/seeed-fusion-diy-xiao-mechanical-keyboard-contest.html) and their [Fusion PCB Assembly service](https://www.seeedstudio.com/pcb-assembly.html).

    > **Status: **Rev 11** Done and Tested**
    >

        * [x] Gerbers designed
        * [x] Firmware (QMK & ZMK)
        * [ ] Breadboard tested
        * [x] Gerbers printed
        * [x] Board tested

    > **Revision History**
    >

        * **Rev 11**: XIAO RP2040 with 3 shift registers (2× `74HC595` + 1× `74HC589`), OLED / e-ink (`SSD1680` WeAct), and push rotary encoder with QMK (actively exploring ZMK support for RP2040 and nRF52840)
        * **Rev 10**: XIAO RP2040 with 3 shift registers (2× `74HC595` + 1× `74HC589`), OLED, and push rotary encoder with QMK
        * **Rev 9**: XIAO RP2040 with 3 shift registers (2× `74HC595` + 1× `74HC165`), OLED, and push rotary encoder with QMK
        * **Rev 7/8**: XIAO RP2040 and nRF52840 with 2× `74HC595` shift registers, rotary encoder, no OLED (both QMK and ZMK firmware supported)
        * **Rev 5/6**: `RP2040` support (Raspberry Pi Pico, WeAct RP2040, and compatible clones), non-push encoder, OLED
        * **Rev 4**: `STM32F401`/`F411` BlackPill, non-push encoder, OLED
        * **Rev 3**: `STM32F401`/`F411` BlackPill, non-push encoder
        * **Rev 2**: `GD32F303` aka [BluePill Plus](https://github.com/WeActStudio/BluePill-Plus) (USB-C `F103` equivalent)
        * **Rev 1**: `STM32F103` / `APM32F103` or `STM32F303`

    ## BOM { #bom }

    ### Microcontrollers { #mcus }

    > **MCU Selection Guide**
    >

        Using off-the-shelf development boards makes DIY keyboard design much simpler because all high-frequency crystal and USB protection circuitry lives on the MCU daughterboard. While I have built handwired boards with AVR (`ATmega32U4`), I strongly advise against using AVR for new designs.

        * **Rev 1**: [`STM32F103C8T6` BluePill](https://stm32-base.org/boards/STM32F103C8T6-Blue-Pill.html) or [RobotDyn `STM32F303CCT6` BlackPill](https://stm32-base.org/boards/STM32F303CCT6-RobotDyn-Black-Pill.html) *(do not confuse with the WeAct F401/F411 BlackPill)*. Micro-USB; requires flashing an `stm32duino` bootloader.
        * **Rev 2**: `GD32F303` [BluePill Plus](https://github.com/WeActStudio/BluePill-Plus) with USB Type-C.
        * **Rev 3 / Rev 4**: WeAct [`STM32F401`/`F411` MiniSTM32F4x BlackPill](https://github.com/WeActStudio/WeActStudio.MiniSTM32F4x) with USB Type-C.
        * **Rev 5 / Rev 6**: `RP2040` ([Raspberry Pi Pico](https://www.raspberrypi.com/documentation/microcontrollers/raspberry-pi-pico.html), [Waveshare RP2040-Plus](https://www.waveshare.com/wiki/RP2040-Plus), or USB-C compatible clones — verify pinout compatibility).
        * **Rev 7 / Rev 9 / Rev 10 / Rev 11**: [Seeed Studio XIAO RP2040](https://wiki.seeedstudio.com/XIAO-RP2040/) and [Seeed Studio XIAO BLE nRF52840](https://wiki.seeedstudio.com/XIAO_BLE/). Ultra-compact footprint using SPI shift registers for matrix scanning.
        * **Need more pins?**: Consider the [WeAct `STM32G431` CoreBoard](https://github.com/WeActStudio/WeActStudio.STM32G431CoreBoard), already supported in QMK.

    ### Component Lists by Revision

    #### Rev 11

    > **Revision 11 BOM**
    >

        * **LEGO Case**: ~46× 1×2 or 1×4 plates (use full bricks if housing a battery), 1× 16×32 double-sided baseplate or 2× 16×16 plates (gray compatible plates minimize PCB flexing), optional 4× 1×1 tiles/eyes and 4× 2×2 corner plates
        * **Diodes**: 66× `1N4148` signal diodes (DO-35 through-hole or SOD-123 SMD)
        * **Resistors**: 5× 10 kΩ (THT or SMD 1206) and 1× 5.1 kΩ (THT or SMD 1206)
        * **MCU**: Seeed Studio XIAO RP2040 (or nRF52840) + recommended female socket headers
        * **Shift Registers**: 2× `74HC595` (SOIC-16 SMD) and 1× `74HC589` (SOIC-16 SMD)
        * **MOSFET**: 1× `2N7002` FET (SOT-23 SMD)
        * **Capacitors (optional)**: 3× 100 nF decoupling capacitors (THT, SMD, or integrated socket)
        * **Battery / Wireless (optional)**: Pogo pins, LiPo battery, 2-pin PH 2.0 battery socket, and 1P2T 4 mm micro slide switch
        * **Encoder**: Clickable EC11 rotary encoder (Bourns 24-pulse incremental encoder with 6 mm flat shaft)
        * **Displays (optional)**:
            * 128×32 I²C OLED (4-pin) + 1×4 DIL socket
            * WeAct SSD1680 e-ink module + 2×4 header and socket

    #### Rev 10

    ??? warning "Revision 10 BOM (Superseded by Rev 11)"

        * Identical to **Rev 11** above, with 128×32 I²C OLED (4-pin) + 1×4 DIL socket (prior to the dedicated 2×4 e-ink header added in Rev 11).

    #### Rev 9

    ??? info "Revision 9 BOM"

        * **LEGO Case**: 16×32 double-sided plate (or 2× 16×16) + ~46× 1×2 or 1×4 plates
        * **Diodes**: 66× `1N4148` signal diodes (DO-35 or SOD-123)
        * **Resistors**: 5× 10 kΩ THT resistors
        * **MCU**: Seeed Studio XIAO RP2040 (or nRF52840) + female headers
        * **Shift Registers**: 2× `74HC595` (DIP-16 THT + sockets) and 1× `74HC165` (DIP-16 THT + socket)
        * **Capacitors (optional)**: 3× 100 nF decoupling capacitors
        * **Battery / Encoder**: Pogo pins, LiPo battery, 2-pin PH 2.0 socket, 1P2T 4 mm micro switch, EC11 clickable rotary encoder

    #### Rev 7/8

    ??? info "Revision 7/8 BOM"

        * **LEGO Case**: 16×32 double-sided plate (or 2× 16×16) + ~46× 1×2 or 1×4 plates
        * **Diodes**: 65× `1N4148` signal diodes (DO-35 or SOD-123)
        * **MCU**: Seeed Studio XIAO RP2040 or XIAO nRF52840 BLE + female headers
        * **Shift Registers**: 2× `74HC595` (DIP-16 THT + sockets)
        * **Capacitors (optional)**: 2× 100 nF decoupling capacitors
        * **Encoder & Battery**: EC11 rotary encoder, optional pogo pins and LiPo battery

    #### Rev 5/6

    ??? info "Revision 5/6 BOM"

        * **LEGO Case**: 16×32 double-sided plate + ~46× 1×2 or 1×4 plates
        * **Diodes**: 65× `1N4148` signal diodes (DO-35 or SOD-123)
        * **MCU**: Raspberry Pi Pico (`RP2040`), WeAct RP2040, Teenstar, or compatible clone + 2×20 round pin headers & DIL sockets
        * **LEDs & Resistors**: 2× LEDs + 2× resistors (`R1`, `R2` — 510 Ω works well for green/yellow LEDs; 1 kΩ for white LEDs)
        * **Switches & Peripherals**: 65× 5-pin PCB-mount MX switches, EC11 rotary encoder, optional 128×32 I²C OLED (with 1×4 DIL socket), optional 3-pin horizontal JST header for LED strip

    #### Rev 4

    ??? info "Revision 4 BOM (and Rev 1–3)"

        * **LEGO Case**: 16×32 double-sided plate + ~46× 1×2 or 1×4 plates
        * **Diodes**: 65× `1N4148` signal diodes (DO-35 or SOD-123)
        * **MCU**: WeAct `STM32F401` or `STM32F411` BlackPill + 2×20 round pin headers and 40-way DIL socket (15.24 mm)
        * **Resistors & LEDs**:
            * `R1`, `R2`: 2× 510 Ω (green/yellow) or 1 kΩ (white) + 2× indicator LEDs
            * `R3`: 1× 100 kΩ pull-up resistor (ensures reliable `STM32F4x1` bootloader entry)
        * **Switches & Peripherals**: 65× 5-pin PCB-mount switches, EC11 rotary encoder, 128×32 I²C OLED (with 1×4 socket), optional 3-pin horizontal JST header for LED strip
        * *(For Rev 1–3, use the same BOM as Rev 4 with the corresponding MCU module.)*

