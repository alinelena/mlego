    A compact **2×2 ortholinear macropad** set in an 8×12 LEGO frame with an optional rotary encoder and I²C OLED display.

    Built around the [Seeed Studio XIAO RP2040](https://www.seeedstudio.com/XIAO-RP2040-v1-0-p-5026.html) and [Seeed Studio XIAO BLE nRF52840](https://www.seeedstudio.com/Seeed-XIAO-BLE-nRF52840-p-5201.html), the **m4** served as the hardware and firmware proving ground for chaining two `74HC595` shift registers over SPI before scaling the design up to the 65-key [m65 Rev 7](#doc/m65).

    Other boards in the Seeed XIAO family ([SAMD21](https://www.seeedstudio.com/Seeeduino-XIAO-Arduino-Microcontroller-SAMD21-Cortex-M0+-p-4426.html), [XIAO BLE Sense](https://www.seeedstudio.com/Seeed-XIAO-BLE-Sense-nRF52840-p-5253.html), and [ESP32C3](https://www.seeedstudio.com/Seeed-XIAO-ESP32C3-p-5431.html)) share the same footprint.

    > **Status: All OK**
    >

        * [x] Gerbers designed
        * [x] Firmware (ZMK & QMK)
        * [x] Breadboard tested
        * [x] Gerbers printed
        * [x] Board tested

    ## Features

    * **Layout**: 2×2 ortholinear (4 keys, 5-pin PCB-mount MX switches)
    * **Controller**: Seeed Studio XIAO nRF52840 BLE (Rev 1) or XIAO RP2040 (Rev 2)
    * **Matrix Expansion**: 2× chained `74HC595` SMD shift registers
    * **Peripherals**: Optional EC11 rotary encoder and I²C OLED display
    * **Firmware**: ZMK (BLE & RP2040) and QMK (RP2040)

