  content: |
    # m8 — 2×4 LEGO Macropad & SPI Testbed

    <div class="spec-badges">
      <span class="spec-badge spec-badge--status">Status: Prototype Tested</span>
      <span class="spec-badge">2×4 Ortho (8 Keys)</span>
      <span class="spec-badge">74HC595 + 74HC589 Shift Registers</span>
      <span class="spec-badge">SPI E-Ink + I²C OLED + Clickable Encoder</span>
      <span class="spec-badge">QMK</span>
    </div>

    ![m8 2x4 test board](https://gitlab.com/m-lego/m4x2/-/raw/main/pics/m4x2.jpg){ loading=lazy }

    The **m8 (m4×2)** is an 8-key hardware development testbed designed to validate scanning a switch matrix via chained **`74HC595`** (column output) and buffered **`74HC589`** (row input) shift registers over hardware SPI while sharing the SPI bus with a **WeAct SSD1680 e-ink display**, alongside an **I²C OLED screen** and a **clickable rotary encoder**.

    The circuitry validated on this board directly informed the architecture of [**m65 Rev 10/11**](#doc/m65) and [**m66 Rev 2/3**](#doc/m66). See [Not Enough Pins?](#doc/notenoughpins) for the full schematic analysis of this SPI bus-sharing circuit.

    ## KiCad Project & Hardware Files { #kicad }

    Full schematics, PCB layouts, and Gerbers are available in the GitLab repository:

    * [ **`m-lego/m4x2` on GitLab**](https://gitlab.com/m-lego/m4x2)
