    === "Rev 9–11 (XIAO RP2040)"

        *(Note: Rev 9–11 correspond to [m66 Rev 1–3](m66.md#matrix-pins) where the clickable encoder forms Column 13.)*

        ```text
        ShiftRegister SN74HC595N (#1 & #2)        ShiftRegister 74HC165N / 74HC589 (#3)
        QB |1    16| VCC                          nPL |1    16| VCC
        QC |2    15| QA                            CP |2    15| nCE
        QD |3    14| SER data                      D4 |3    14| D3
        QE |4    13| OE                            D5 |4    13| D2
        QF |5    12| RCLK latch                    D6 |5    12| D1
        QG |6    11| SRCLK clock                   D7 |6    11| D0
        QH |7    10| SRCLR                        nQ7 |7    10| DS
         G |8     9| QH*                            G |8     9| Q7
        ```

