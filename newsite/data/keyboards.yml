    ## Firmware { #firmware }

    Both **QMK** and **ZMK** are supported. You can download prebuilt `.uf2` binaries below or compile from source.

    ### ZMK { #zmk }

    Latest ZMK builds are available from the [mlego-zmk GitHub Actions workflow](https://github.com/alinelena/mlego-zmk/actions/workflows/build.yml) (select the latest successful **Build mlego** run):

    * [Prebuilt ZMK firmware for Rev 4](https://github.com/alinelena/mlego-zmk/tree/main/firmware)

    ### QMK Prebuilt UF2 { #qmk }

    * [mlego_m66_rev4_default_rgb_screen.uf2](https://gitlab.com/m-lego/m65/-/blob/devel/firmware/mlego_m66_rev4_default_rgb_screen.uf2)
    * [mlego_m66_rev4_uk_rgb_screen.uf2](https://gitlab.com/m-lego/m65/-/blob/devel/firmware/mlego_m66_rev4_uk_rgb_screen.uf2)
    * [mlego_m66_rev3_default.uf2](https://gitlab.com/m-lego/m65/-/blob/devel/firmware/mlego_m66_rev3_default.uf2)
    * [mlego_m66_rev3_uk.uf2](https://gitlab.com/m-lego/m65/-/blob/devel/firmware/mlego_m66_rev3_uk.uf2)
    * [mlego_m66_rev2_default.uf2](https://gitlab.com/m-lego/m65/-/blob/devel/firmware/mlego_m66_rev2_default.uf2)
    * [mlego_m66_rev2_uk.uf2](https://gitlab.com/m-lego/m65/-/blob/devel/firmware/mlego_m66_rev2_uk.uf2)
    * [mlego_m66_rev1_default.uf2](https://gitlab.com/m-lego/m65/-/blob/devel/firmware/mlego_m66_rev1_default.uf2)
    * [mlego_m66_rev1_uk.uf2](https://gitlab.com/m-lego/m65/-/blob/devel/firmware/mlego_m66_rev1_uk.uf2)

    Latest automated QMK builds can also be downloaded from [GitHub Actions](https://github.com/alinelena/qmk_firmware/actions/workflows/build.yml).

    ### QMK Source Build { #qmk-source }

    === "Rev 4"

        ```bash
        git clone --recurse-submodules -b mlego_dev https://github.com/alinelena/qmk_firmware.git qmk-alin
        cd qmk-alin
        qmk compile -kb mlego/m66/rev4 -km uk
        qmk compile -kb mlego/m66/rev4 -km default
        ```

