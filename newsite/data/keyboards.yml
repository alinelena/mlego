    ## Matrix Scan Frequencies & OLED Benchmarks { #scan-frequencies }

    Matrix scan frequencies (in Hz) reported by QMK with `DEBUG_MATRIX_SCAN_RATE` enabled using the default keymap:

    | MCU Platform | Revision | Freq 1 (Minimal)¹ [Hz] | Freq 2 (Full Features)² [Hz] |
    | :--- | :--- | :---: | :---: |
    | Teensy 2.0 (`ATmega32U4`) | Handwire | `1860` | — |
    | `APM32F103C8T6` (`STM32F103`) | Rev 1 | `3427` | — |
    | `GD32F303CCT6` (BluePill Plus) | Rev 2 | `3931` | — |
    | `STM32F401` BlackPill | Rev 4 | `4681` | `1976` |
    | `RP2040` Raspberry Pi Pico | Rev 5 | `5277` | `2214` |
    | `RP2040` WeAct | Rev 6 | `5278` | `2202` |
    | `RP2040` Seeed XIAO (2× `74HC595`) | Rev 7 | `6162` | — |
    | `RP2040` Seeed XIAO (2× `595` + 1× `165`) | Rev 9³ | `4366` | `2125` |
    | `RP2040` Seeed XIAO (Unicode enabled) | Rev 9 | `3986` | `1924` |

    1. **Freq 1**: OLED off, WPM off, RGBLight off, Mousekey and Extrakey off.
    2. **Freq 2**: OLED on with all standard features enabled.
    3. **Rev 9**: Includes an extra 14th column compared to earlier revisions; `SPI_DIVISOR` is `8` on Rev 9 vs `32` on Rev 7.

    ### Impact of `OLED_UPDATE_INTERVAL` { #oled-case }

    Updating an I²C OLED display on every matrix scan causes a noticeable drop in scan rate. QMK provides `OLED_UPDATE_INTERVAL` (in milliseconds) to throttle display refreshes. Tested on **Rev 9** (`128×32` and `128×64` screens yield identical numbers; baselines with OLED off: `3760 Hz` with WPM off, `2631 Hz` with WPM on):

    | `OLED_UPDATE_INTERVAL` [ms] | Matrix Scan Frequency [Hz] |
    | :---: | :---: |
    | `0` *(QMK default)* | `2125` |
    | `1` | `3154` |
    | `2` | `3629` |
    | `3` | `3788` |
    | `4` | `3868` |
    | `5` | `3915` |
    | **`10`** *(100 FPS — recommended)* | **`4011`** |
    | `20` | `4058` |
    | `30` | `4075` |
    | `50` | `4087` |
    | `100` | `4097` |

    > **Takeaways**
    >
        1. Setting `OLED_UPDATE_INTERVAL` to **`10` ms** (100 FPS) nearly doubles the effective matrix scan rate (`4011 Hz` vs `2125 Hz`) while remaining more than fast enough for any keyboard status OLED.
        2. Curiously, throttling the OLED refresh achieves a higher peak scan rate (`4097 Hz`) than compiling with the OLED disabled (`3760 Hz`).
