- id: assembly
  title: Step-by-Step Assembly Guide
  category: guides
  badge: Build Guide
  image: pics/final_3.webp
  summary: 'Illustrated soldering and assembly walkthrough: sockets, diodes, LED resistor
    calculations, and LEGO case mounting.'
  content: |
    # Step-by-Step Assembly Guide

    <div class="spec-badges">
      <span class="spec-badge">Build Time: ~2 Hours</span>
      <span class="spec-badge">Through-Hole Soldering</span>
      <span class="spec-badge">Modular LEGO Enclosure</span>
    </div>

    ## Before You Start { #before-you-start }

    > **Prerequisites**
    >
        This guide assumes you know basic through-hole soldering, have reviewed the **BOM** section for your keyboard revision, and have all components and the PCB ready. While the soldering complexity is low, expect the full assembly to take around **2 hours**.

    > **Familiarize Yourself with the PCB**
    >
        * **Front side**: The side with the silkscreen artwork (switches, MCU socket, and OLED mount on this side).
        * **Back side**: The underside where component leads are soldered.
        * You can ignore `R4` and `R5` on older revisions (`m65 Rev 4`), as they are only used in advanced configurations with special I²C pull-ups.

    <div class="image-grid" markdown>
    ![PCB front side](pics/m65-rev4-pcb-front.webp){ loading=lazy }
    ![PCB back side](pics/m65-rev4-pcb-back.webp){ loading=lazy }
    </div>

    ## 1. Preparing the MCU Socket & Headers { #mcu }

    > **Always Socket Your Microcontroller**
    >
        Whatever MCU board you use (`STM32` BlackPill, Raspberry Pi Pico `RP2040`, or Seeed Studio `XIAO`), **strongly consider socketing it** so it can be replaced or reused easily.

    1. For 40-pin boards, I use **machined round pin headers** paired with a **40-way DIL socket** (or two single-row 20-pin female headers, which are especially convenient for Raspberry Pi Pico boards).

    <div class="image-grid" markdown>
    ![Round headers and 40-way DIL socket](pics/header_1.webp){ loading=lazy }
    ![Single-row female header sockets](pics/sockets.webp){ loading=lazy }
    </div>

    > **Header Orientation**
    >
        Insert the male header pins partway into the socket with the **conical/tapered pins pointing down into the socket**, then place the MCU board on top. Using the socket as a jig keeps both rows perfectly parallel.

    <div class="image-grid" markdown>
    ![Headers seated in socket jig](pics/header_2.webp){ loading=lazy }
    ![MCU placed on top of headers ready to solder](pics/header_3.webp){ loading=lazy }
    </div>

    2. Verify the headers are vertical and stable. Solder the two corner pins of each row first to tack the alignment, then solder the remaining pins.

    <div class="image-grid" markdown>
    ![Soldered MCU headers top view](pics/header_4.webp){ loading=lazy }
    ![Soldered MCU headers side profile](pics/header_5.webp){ loading=lazy }
    </div>

    ## 2. Preparing the OLED Display { #oled }

    If your build includes an I²C OLED screen, socket it as well using a 4-pin row of round machine pins and a low-profile 1×4 socket:

    1. Use the keyboard PCB itself as an alignment jig: place the 4-pin header into the PCB pads (conical side pointing down toward the PCB), seat the OLED module on top, and level it with a bit of Blu-Tack or painter's tape.
    2. Solder the 4 pins to the **OLED module only** (do not solder the header directly to the keyboard PCB!), then remove the OLED assembly.

    <div class="image-grid" markdown>
    ![OLED header and socket](pics/header_6.webp){ loading=lazy }
    ![OLED aligned on PCB jig](pics/header_7.webp){ loading=lazy }
    ![Completed removable OLED module](pics/header_8.webp){ loading=lazy }
    </div>

    ## 3. Soldering the Diodes { #diodes }

    Prepare your `1N4148` (DO-35 through-hole) signal diodes (65 or 66 for `m65`/`m66`, 60 for `m60`, 48 for `m48`, 20 for `m20`).

    1. Bend the leads at 90° as shown below.

    ![1N4148 diode bent at 90 degrees](pics/diodes_1.webp){ loading=lazy }

    > **Diode Polarity (Black Cathode Band)**
    >
        Note the **black ring/collar (cathode)** at one end of the glass body. Insert every diode from the front of the PCB with the **black collar oriented toward the bottom/lower pad** (matching the silkscreen diode triangle/bar symbol).

    2. Splay the leads outward on the back of the PCB to hold each diode snug against the board while flipping it over. Working column by column is fastest.

    <div class="image-grid" markdown>
    ![Diodes inserted on front side](pics/diodes_2.webp){ loading=lazy }
    ![Diode leads bent on back side](pics/diodes_3.webp){ loading=lazy }
    </div>

    > **Trimming Diode Leads**
    >
        After soldering, use flush cutters to trim the excess leads cleanly at the solder joint. *(Alternatively, you can wiggle the leads until they snap off at the joint, though it is good practice to briefly reflow the joint afterward if you do so.)*

    3. For the horizontal diodes along the top row, bend one lead straight down beside the glass body as shown below so you can populate the entire row in one pass:

    <div class="image-grid" markdown>
    ![Soldered diode joint](pics/diodes_4.webp){ loading=lazy }
    ![Top row diode bending](pics/diodes_5.webp){ loading=lazy }
    ![All diodes soldered](pics/diodes_6.webp){ loading=lazy }
    </div>

    ## 4. Soldering the Resistors { #resistors }

    Resistors are non-polarized — bend, insert, and splay the leads just like the diodes, ensuring the right resistance value goes into each footprint:

    > **Resistor Values (Rev 4–6)**
    >
        * **`R3` (100 kΩ or 22 kΩ)**: Required on `STM32F401`/`F411` BlackPill builds so the MCU enters DFU bootloader mode reliably.
        * **`R1` & `R2` (LED Current-Limiting)**: Select based on your LED color and desired brightness — 510 Ω gives a pleasant glow on green/yellow LEDs, while 1 kΩ works well for bright white LEDs.

    > **Testing LED Brightness & Polarity**
    >
        Before soldering `R1`/`R2` and the LEDs, test them on a breadboard (or with DuPont jumper wires from a 3.3 V pin on your MCU) to confirm you like the brightness and to verify which LED leg is positive (3.3 V) and which is negative (`GND`) — some batch LEDs do not follow the standard long-leg-anode convention!

    <div class="image-grid" markdown>
    ![Resistors inserted](pics/resistor_1.webp){ loading=lazy }
    ![Resistors soldered](pics/resistor_2.webp){ loading=lazy }
    </div>

    ## 5. Soldering the MCU & OLED Sockets { #sockets }

    1. Place the 40-way DIL MCU socket (or female headers) onto the front of the PCB and hold it flat with painter's tape.
    2. Flip the board over, solder the diagonal corner pins first while pressing the socket flush against the PCB, verify alignment, and solder all remaining pins.
    3. Repeat for the 4-pin OLED socket.

    <div class="image-grid" markdown>
    ![MCU socket taped in place](pics/socket_1.webp){ loading=lazy }
    ![OLED socket placed](pics/socket_2.webp){ loading=lazy }
    ![Sockets soldered](pics/socket_3.webp){ loading=lazy }
    </div>

    ## 6. Soldering Indicator LEDs { #leds }

    > **LED Polarity**
    >
        Insert each LED into the position matching its resistor (`R1` or `R2`). Ensure the **cathode (ground) leg goes into the square-plated hole**. Splay the legs, solder from the back, and trim flush.

    <div class="image-grid" markdown>
    ![Indicator LEDs inserted](pics/led_1.webp){ loading=lazy }
    ![Indicator LEDs soldered](pics/led_2.webp){ loading=lazy }
    </div>

    ## 7. Mounting & Soldering Switches { #switches }

    1. Inspect your 5-pin switches to make sure no metal pins are bent, then press them firmly into the PCB until the plastic legs snap flush.
    2. Sight down each row and column to confirm all switches sit level and straight.

    > **Loose-Fitting Switches**
    >
        Some switch housings (such as certain Kailh batches) fit slightly looser in PCB-mount holes. Place a flat hardcover book on top of the switches when flipping the board over so every switch stays seated flush against the PCB while soldering.

    <div class="image-grid" markdown>
    ![Switches seated on front](pics/switches_1.webp){ loading=lazy }
    ![Switch pins ready to solder on back](pics/switches_2.webp){ loading=lazy }
    </div>

    ## 8. Soldering the Rotary Encoder { #encoder }

    Snap the EC11 rotary encoder into its footprint at the top-right corner. On earlier revisions (`Rev 1–8`), only the 3 rotational pins are routed; on `Rev 9+` and `m66`, all 5 signal pins (including the push-button switch) are active. Solder all signal pins as well as the two side mounting tabs for mechanical strength.

    <div class="image-grid" markdown>
    ![Rotary encoder seated](pics/encoder_1.webp){ loading=lazy }
    ![Rotary encoder soldered](pics/encoder_2.webp){ loading=lazy }
    </div>

    > **PCB Soldering Complete!**
    >
        Your keyboard PCB assembly is now electrically complete.

    ## 9. Building the LEGO Enclosure & Final Testing { #the-box }

    1. Assemble your LEGO base using a 16×32 baseplate (or two 16×16 plates) and perimeter 1×2 / 1×4 plates. For a ~6° typing angle, stack a full brick + plate along the top edge.
    2. Add a sheet of hobbycraft foam inside the cavity for sound dampening, then align the PCB mounting holes over the perimeter LEGO studs and press down gently until the 1.6 mm PCB sits flush with the studs.
    3. Seat the socketed MCU, OLED screen, and encoder knob, then plug in the USB cable.

    <div class="image-grid" markdown>
    ![LEGO baseplate parts](pics/lego_1.webp){ loading=lazy }
    ![LEGO perimeter walls assembled](pics/lego_2.webp){ loading=lazy }
    ![PCB mounted on LEGO case](pics/final_1.webp){ loading=lazy }
    ![MCU and OLED seated](pics/final_2.webp){ loading=lazy }
    </div>

    > **First Power-On Checklist**
    >
        * **OLED Screen**: Displays "an elephant inside a boa constrictor" splash graphic for a few seconds, then switches to the active layer indicator and live WPM counter.
        * **Rotary Encoder**: Turning the knob adjusts system volume (`Vol+` / `Vol-`).
        * **Layer Tap-Dance LEDs**:
            * Double-tap the **3rd key from the left on the bottom row** (`Lower`): the first indicator LED next to the encoder lights up (double-tap again to toggle off).
            * Double-tap the **5th key from the left on the bottom row** (`Raise`): the second indicator LED lights up.
        * **Key Matrix**: Test every switch in a keyboard tester — then install your keycaps and enjoy!

    ![Finished mlego keyboard with keycaps](pics/final_3.webp){ loading=lazy }
- id: notenoughpins
  title: Not Enough Pins? Matrix Expansion
  category: guides
  badge: Hardware Guide
  image: pics/matrix-2b_v2.webp
  summary: Exhaustive engineering tutorial on driving large matrices from tiny MCUs
    via SPI shift registers and matrix folding.
  content: |
    # Not Enough Pins for Your Keyboard Matrix?

    <div class="spec-badges">
      <span class="spec-badge">SPI Shift Registers</span>
      <span class="spec-badge">74HC595 · 74HC165 · 74HC589</span>
      <span class="spec-badge">Matrix Remapping (5×13 → 8×9)</span>
      <span class="spec-badge">QMK &amp; ZMK</span>
    </div>

    So you decided to wire a custom mechanical keyboard, but your favorite compact microcontroller doesn't expose enough GPIO pins for the full switch matrix. This is the exact challenge I hit when moving the 65-key [**m65**](#doc/m65) onto the tiny 11-pin **Seeed Studio XIAO RP2040**.

    ## Common Pin-Reduction Approaches

    Before settling on SPI shift registers, I surveyed the existing approaches used in the community:

    * **Duplex Matrix**: Folds long rows/columns by wiring two switches per row/column intersection with opposing diodes. Effective, but makes schematic reading and routing more mentally taxing.
    * **Direct-Pin Shift Registers**: Used in boards like [tzarc's Ghoul](https://github.com/tzarc/ghoul) with chained `74HC589` shift registers (one bit per switch, no matrix). Great scan speed, but requires many ICs for 65+ keys.
    * **I²C IO Expanders & Demuxers**: Popular on split boards (e.g., [Ferris IO Expander guide](https://github.com/pierrechevalier83/ferris/wiki/Understanding-the-QMK-firmware-for-the-IO-Expander)) or `74HC138` 3-to-8 decoders in QMK.
    * **SPI Shift-Register Matrix Scanning**: Using inexpensive `74HC595` (serial-in, parallel-out) and `74HC165` / `74HC589` (parallel-in, serial-out) shift registers to drive columns and/or read rows over hardware SPI.
        * Background tutorials on shift registers: [Last Minute Engineers — `74HC595`](https://lastminuteengineers.com/74hc595-shift-register-arduino-tutorial/) and [DroneBot Workshop — `74HC595` & `74HC165`](https://dronebotworkshop.com/shift-registers/).
        * Initial keyboard inspiration: [mehmedbasic.dk — `74HC595` Keyboard](https://mehmedbasic.dk/post/74hc595-keyboard/).

    > **Official QMK Support & Acknowledgments**
    >
        When I started experimenting with these circuits, QMK had very few public examples. Since QMK `0.20.0`, boards like Keychron and `hazel/bad_wings` use `74HC595`, and `handwired/dqz11n1g` uses `74HC165`. Huge thanks to **sigprof** and **tzarc** for their guidance on SPI timing and tri-state buffering.

    > **Disclaimer**
    >
        While the schematics and firmware below work reliably together to scan a 13×5 / 14×5 matrix at 4,000–6,000+ Hz, remember I am a hardware enthusiast rather than an electrical engineer — use and adapt them at your own risk!

    ---

    ## Method 1: Scan Columns via `74HC595` + Direct GPIO Rows { #1-scan-only-columns-with-shift-registers }

    Uses **2× [`74HC595`](https://www.ti.com/product/SN74HC595)** output shift registers chained over SPI (`MOSI`, `SCK`, `RCLK`) to drive up to 16 columns using only **3 MCU pins**, while the 5 rows are read directly on 5 MCU GPIO pins (total: **8 pins** for a 5×16 matrix).

    ![Matrix Version 1 — 2x 74HC595 column scanning](pics/matrix-1.webp){ loading=lazy }

    * **QMK Implementation**: [`mlego/m65/rev7/matrix.c`](https://github.com/alinelena/qmk_firmware/tree/mlego_dev/keyboards/mlego/m65/rev7/matrix.c)
    * **ZMK Implementation**: [`mlego5x13_rev8.overlay` (`zmk,kscan-gpio-matrix` + `74hc595`)](https://github.com/alinelena/mlego-zmk/blob/main/config/boards/shields/mlego5x13_rev8/mlego5x13_rev8.overlay)

    ---

    ## Method 2a: Scan Columns (`74HC595`) & Rows (`74HC165`) — Unbuffered { #2a-scan-both-columns-and-rows-with-shift-registers }

    Uses **2× `74HC595`** (columns) and **1× [`74HC165`](https://www.ti.com/product/SN74HC165)** (rows). Both ICs are inexpensive and widely available in through-hole (DIP-16) and SMD (SOIC-16) packages. Reads the entire 5×14 matrix using only **4 MCU pins** (`MOSI`, `MISO`, `SCK`, shared `Latch`).

    > **Limitation: Unbuffered `MISO`**
    >
        Because the `74HC165` serial output (`Q7`) does not have a true high-impedance (3-state) output when deselected, **you cannot easily share the `MISO` pin with other SPI peripherals** without adding external tri-state buffer circuitry.

    ![Matrix Version 2a — 2x 74HC595 + 1x 74HC165](pics/matrix-2a.webp){ loading=lazy }

    * **QMK Implementation**: [`mlego/m66/rev1/matrix.c`](https://github.com/alinelena/qmk_firmware/blob/mlego_dev/keyboards/mlego/m66/rev1/matrix.c)

    ---

    ## Method 2b: Scan Columns (`74HC595`) & Rows (`74HC589`) — Buffered 3-State SPI { #2b-scan-both-columns-and-rows-with-shift-registers }

    Replaces the `74HC165` with a **1× [`74HC589`](https://www.onsemi.com/pdf/datasheet/mc74hc589a-d.pdf)** (mostly SMD today). The `74HC589` includes an internal **3-state output buffer**, allowing the `MISO` line to be cleanly shared with other SPI devices (such as SPI e-ink or Sharp Memory displays).

    ### Variant 1 (Single Shared Latch — Deprecated) { #variant-1 }

    > **Do Not Use Variant 1 for New Designs**
    >
        While this single-latch circuit (`m65 Rev 10` / `m66 Rev 2`) works with carefully tuned firmware timing, it relies on edge-case latch/output-enable behavior. Use **Variant 2** below instead.

    ![Matrix Version 2b Variant 1](pics/matrix-2b.webp){ loading=lazy }

    * **QMK Reference**: [`mlego/m66/rev2/matrix.c`](https://github.com/alinelena/qmk_firmware/blob/mlego_dev/keyboards/mlego/m66/rev2/matrix.c)

    ### Variant 2 (Separate Chip Selects — Recommended) { #variant-2 }

    Uses separate latch / chip-select lines for the `2× 74HC595` column driver and the `1× 74HC589` row reader (costing 1 extra pin compared to Variant 1, for **5 SPI pins total**), making SPI bus sharing and matrix scanning clean and deterministic.

    ![Matrix Version 2b Variant 2](pics/matrix-2b_v2.webp){ loading=lazy }

    * **QMK Implementation**: [`mlego/m66/rev3/matrix.c`](https://github.com/alinelena/qmk_firmware/blob/mlego_dev/keyboards/m66/rev3/matrix.c)

    > **Hybrid Scanning**
    >
        All three shift-register methods above can be combined with direct GPIO pins in custom `matrix.c` routines if you want to mix shift-register columns with extra direct keys.

    ---

    ## Method 3: Mathematical Matrix Restructuring (Zero Extra Hardware) { #restructure-the-matrix }

    If you are only short by **1 or 2 GPIO pins**, you don't need any shift registers at all — simply **decouple the electrical matrix dimensions from the physical key layout** so the row and column counts are closer to a square (Rows ≈ Cols maximizes Rows × Cols for a fixed pin budget Rows + Cols).

    * **Example 1**: A physical **6×17** board (68 keys) normally requires 6 + 17 = 23 pins. Electrically wiring it as a **10×7** or **9×8** matrix reduces the pin count to 17 pins — saving **6 pins**!
    * **Example 2 (`m65` 5×13 Ortho)**:
        * **Standard 5×13 Matrix**: Uses 5 + 13 = **18 pins** (`65` positions).
        * **Restructured 8×9 Matrix**: Uses 8 + 9 = **17 pins** (`72` positions, saving 1 pin with 7 spare switch slots!).

    Both QMK (via data-driven `info.json` `"matrix": [row, col]` coordinates) and ZMK (via `zmk,matrix-transform`) make this remapping trivial:

    === "Standard 5×13 Matrix (18 Pins)"

        **1. `info.json` Pin Definition (`5 + 13 = 18` pins)**:

        ```json
        "matrix_pins": {
            "cols": ["GP1", "GP6", "GP7", "GP8", "GP9", "GP15", "GP14", "GP13", "GP12", "GP11", "GP10", "GP17", "GP21"],
            "rows": ["GP22", "GP16", "GP18", "GP19", "GP20"]
        }
        ```

        **2. Physical-to-Electrical Mapping (1:1 Grid)**:

        ```text
        ┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐
        │0A││0B││0C││0D││0E││0F││0G││0H││0I││0J││0K││0L││0M│
        └──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘
        ┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐
        │1A││1B││1C││1D││1E││1F││1G││1H││1I││1J││1K││1L││1M│
        └──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘
        ┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐
        │2A││2B││2C││2D││2E││2F││2G││2H││2I││2J││2K││2L││2M│
        └──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘
        ┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐
        │3A││3B││3C││3D││3E││3F││3G││3H││3I││3J││3K││3L││3M│
        └──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘
        ┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐┌──┐
        │4A││4B││4C││4D││4E││4F││4G││4H││4I││4J││4K││4L││4M│
        └──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘└──┘
        ```

        **3. Full `LAYOUT_ortho_5x13` Definition**:

        ??? code "Expand 5×13 `info.json` Layout Definition"

            ```json
            "LAYOUT_ortho_5x13": {
                "layout": [
                    { "label": "⎋" , "matrix": [0, 0] , "w": 1, "x": 0 , "y": 0 },
                    { "label": "1" , "matrix": [0, 1] , "w": 1, "x": 1 , "y": 0 },
                    { "label": "2" , "matrix": [0, 2] , "w": 1, "x": 2 , "y": 0 },
                    { "label": "3" , "matrix": [0, 3] , "w": 1, "x": 3 , "y": 0 },
                    { "label": "4" , "matrix": [0, 4] , "w": 1, "x": 4 , "y": 0 },
                    { "label": "5" , "matrix": [0, 5] , "w": 1, "x": 5 , "y": 0 },
                    { "label": "6" , "matrix": [0, 6] , "w": 1, "x": 6 , "y": 0 },
                    { "label": "7" , "matrix": [0, 7] , "w": 1, "x": 7 , "y": 0 },
                    { "label": "8" , "matrix": [0, 8] , "w": 1, "x": 8 , "y": 0 },
                    { "label": "9" , "matrix": [0, 9] , "w": 1, "x": 9 , "y": 0 },
                    { "label": "0" , "matrix": [0, 10], "w": 1, "x": 10, "y": 0 },
                    { "label": "-" , "matrix": [0, 11], "w": 1, "x": 11, "y": 0 },
                    { "label": "⌫" , "matrix": [0, 12], "w": 1, "x": 12, "y": 0 },
                    { "label": "↹", "matrix": [1, 0] , "w": 1, "x": 0 , "y": 1 },
                    { "label": "q" , "matrix": [1, 1] , "w": 1, "x": 1 , "y": 1 },
                    { "label": "w" , "matrix": [1, 2] , "w": 1, "x": 2 , "y": 1 },
                    { "label": "e" , "matrix": [1, 3] , "w": 1, "x": 3 , "y": 1 },
                    { "label": "r" , "matrix": [1, 4] , "w": 1, "x": 4 , "y": 1 },
                    { "label": "t" , "matrix": [1, 5] , "w": 1, "x": 5 , "y": 1 },
                    { "label": "y" , "matrix": [1, 6] , "w": 1, "x": 6 , "y": 1 },
                    { "label": "u" , "matrix": [1, 7] , "w": 1, "x": 7 , "y": 1 },
                    { "label": "i" , "matrix": [1, 8] , "w": 1, "x": 8 , "y": 1 },
                    { "label": "o" , "matrix": [1, 9] , "w": 1, "x": 9 , "y": 1 },
                    { "label": "p" , "matrix": [1, 10], "w": 1, "x": 10, "y": 1 },
                    { "label": "[" , "matrix": [1, 11], "w": 1, "x": 11, "y": 1 },
                    { "label": "]" , "matrix": [1, 12], "w": 1, "x": 12, "y": 1 },
                    { "label": "#" , "matrix": [2, 0] , "w": 1, "x": 0 , "y": 2 },
                    { "label": "a" , "matrix": [2, 1] , "w": 1, "x": 1 , "y": 2 },
